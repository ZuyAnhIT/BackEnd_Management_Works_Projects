spring.application.name=project-manager-api
server.port=8082

# Cấu hình Database
spring.datasource.url=jdbc:mysql://localhost:3306/QuanLyCongViecDuAn
spring.datasource.username=admin123@
spring.datasource.password=admin123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA/Hibernate
# Tắt DDL tự động (tạo/sửa bảng) để an toàn hơn trong môi trường Production
# Đối với môi trường Dev, bạn có thể dùng: spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none

# Cấu hình chiến lược đặt tên vật lý của Hibernate
# Map camelCase fields to snake_case columns using Hibernate 6 strategy (Boot 3 compatible)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Optional: also apply Spring implicit naming (safe with existing explicit @JoinColumn)
# spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy


