# ==================================
# SERVER CONFIGURATION
# ==================================
spring.application.name=project-manager-api
server.port=8082

# ==================================
# DATABASE (JPA / HIBERNATE)
# ==================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tắt DDL tự động (tạo/sửa bảng) để an toàn hơn trong môi trường Production
# Dev: update | Prod: none hoặc validate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==================================
# EMAIL CONFIGURATION (SMTP)
# ==================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==================================
# SECURITY & JWT
# ==================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-min=10080

# ==================================
# GOOGLE OAUTH2
# ==================================
google.client-id=${GOOGLE_CLIENT_ID}

# ==================================
# PAYMENT GATEWAY (PAYOS)
# ==================================
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=http://localhost:3000/payment/success
payos.cancel-url=http://localhost:3000/payment/cancel

# ==================================
# APPLICATION SPECIFIC
# ==================================
app.frontend.url=http://localhost:3000
app.upload.dir=uploads